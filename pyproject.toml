[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "generative-flow-adapters"
version = "0.1.0"
description = "Adapter-first research framework for action-conditioned diffusion and flow world models"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "torch==2.9.0",
  "torchvision==0.24.0",
  "torchaudio==2.9.0",
  "xformers==0.0.33.post1",
  "PyYAML>=6.0",
  "einops>=0.8.2",
  "diffusers>=0.37.1",
  # Pin below 1.0: transformers/peft (pulled in via diffusers) hard-require
  # huggingface-hub<1.0. Without this pin uv floats hub up to 1.x and the
  # training entrypoint dies with an ImportError at `import transformers`.
  "huggingface-hub>=0.30,<1.0",
  "wandb[media]>=0.27.0",
  "open-clip-torch>=3.3.0",
  "h5py>=3.16.0",
  "moviepy>=2.2.1",
  # Generative-visual quality metrics (training-time eval), implemented natively
  # in training/quality_metrics.py — no external_deps. torchmetrics[image] pulls
  # torch-fidelity (FID) + lpips; cd-fvd provides FVD (i3d / VideoMAE).
  "torchmetrics[image]>=1.4",
  "cd-fvd>=0.1",
  "easydict>=1.13",
  # Wan2.2 runtime deps (external_repos/Wan2.2/requirements.txt). Declared here
  # so `uv run`/`uv sync` keep them — bare `uv run` prunes anything not in the
  # lock at job start, and these are undeclared extras otherwise. decord + cv2
  # are imported by our own backbones/lvdm code; peft/librosa/accelerate are
  # pulled in by `import wan`. transformers is capped below 5.x transitively by
  # the huggingface-hub<1.0 pin above. Transitive deps (numba, llvmlite, soxr,
  # scikit-learn, rich, typer, psutil, tokenizers, …) return automatically.
  "accelerate>=1.1.1",
  "peft>=0.19",
  "decord>=0.6",
  "opencv-python>=4.9.0.80",
  "librosa>=0.11",
  "ftfy>=6.1",
  "imageio-ffmpeg>=0.4",
]

[project.optional-dependencies]
diffusers = [
  "diffusers>=0.30",
  "accelerate>=0.33",
  "transformers>=4.44",
]

dynamicrafter = [
  "einops>=0.7",
  "numpy>=1.26",
  "pytorch-lightning>=2.2",
  "open_clip_torch>=2.24",
]

data = [
  "h5py>=3.10",
  "numpy>=1.26",
]

dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "h5py>=3.10",
  "numpy>=1.26",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
xformers = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

