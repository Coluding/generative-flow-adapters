# Wan2.2-TI2V-5B (flow matching, diffusion forcing) + SHORTCUT-ONLY adapter:
# step-size-conditioned, NO action conditioning. The pure D3 test.
#
# Fork of diffusion_wan22_avid_gatelow_metaworld.yaml (the 2026-07-15
# gate-fixed controlled-retest baseline, shortcut ON) with exactly one change:
#
#   conditioning.input_dim: 4 -> null
#     build_condition_encoder returns None when input_dim is unset (see
#     conditioning/encoders.py), so no action encoder is built, cond carries no
#     `embedding`, and the adapter factory gets action_token_dim=None (no
#     cross-attention token path). The Wan output adapter explicitly allows
#     action-free conds; step_level conditioning is untouched (it is read
#     directly from the cond dict via adapter.extra.use_step_level_conditioning,
#     not through the action encoder).
#
# The adapter's whole job here is to distill the frozen base into a good
# few-step generator. Decouples "does the shortcut work?" (D3) from "does
# action conditioning work?" (D2) — completes the {action}x{shortcut} matrix:
# action-OFF/shortcut-ON. Read the NFE-row grid: few-step adapted rows
# approaching many-step quality AND beating the frozen base at the same
# few-step budget = shortcut works.
#
# See thesis-vault 20_Tickets/experiments/exp-shortcut-action-free-isolation.md.
#
# PREREQUISITES: Wan2.2-TI2V-5B DiT + Wan2.2_VAE.pth in the ckpt dir.
# Run with scripts/train_wan22_i2v_metaworld_EXTERNAL.py — NOT the plain
# train_wan22_i2v_metaworld.py (real weights only load there; see
# diffusion_wan22_dcunet_output_metaworld.yaml's header for why).

name: flow_wan22_shortcut_only_metaworld

data:
  frame_stride: 1
  fs_value: 1
  val_fraction: 0.01
  # eval_hdf5: ds/metaworld_corner2_val.hdf5

model:
  type: flow
  provider: wan2.2
  prediction_type: velocity
  freeze: true
  # pretrained_model_name_or_path: ckpts/Wan2.2-TI2V-5B
  extra:
    wan_config_path: configs/base/wan2.2_ti2v_5B.yaml
    allow_missing_checkpoint: true
    dtype: bf16
    latent_channels: 48
    temporal_length: 41     # pixel-frame window -> 11 latent frames (t_lat = 1 + (41-1)/4)
    max_area: 589824         # 704 * 1280
    latent_height: 16
    latent_width: 16
    text_prompts_file: configs/prompts/metaworld_tasks.yaml   # null -> frame-only (no text)

adapter:
  type: output
  hidden_dim: 256
  feature_dim: 48            # Wan2.2 latent channel count
  composition: mask_mix      # AVID prediction-blend: base*σ(gate) + pred*(1-σ(gate))
  gate_bias: 0.0              # σ(0)=0.5 -> balanced 50/50 at init (AVID-matched)
  extra:
    backbone: wan            # AVID-style small Wan DiT delta (here: step-size-only)
    wan_adapter_config_path: configs/base/wan_adapter_34m.yaml
    condition_on_base_outputs: true
    use_step_level_conditioning: true
    step_level_key: step_level
    step_level_transform: log2
    action_dropout_prob: 0.0   # inert — no action path is built

conditioning:
  type: action
  input_dim: null          # ACTION-FREE: no encoder is built, adapter sees no action
  output_dim: 512
  drop_condition_prob: 0.0

training:
  loss: flow_matching
  learning_rate: 1.0e-4
  grad_clip_norm: 1.0
  grad_accum_steps: 4          # effective batch 8 at --batch-size 2 (matches pg3x72uc)
  linear_warmup_steps: 250     # matches AVID's active warmup
  shortcut_direction_weight: 1.0       # shortcut self-consistency supervision (masked to predicted frames)
  shortcut_target_method: distillation
  inference_every_n_steps: 300
  eval_every_n_steps: 5
  quality_metrics: [psnr, ssim, lpips, mse]
  quality_eval_num_batches: 4
  quality_eval_num_steps: 1
  quality_dist_metrics: [fvd, fid]
  quality_dist_every_n_steps: 5
  quality_dist_num_batches: 4

  extra:
    amp_dtype: bf16
    use_batch_timesteps_for_flow: true
    flow_timestep_scale: 1000
    inference_guide_scale: 5.0
    inference_shift: 5.0
    inference_use_prompt: true
    inference_frame_num: 41
    inference_seed: 0
    inference_max_area: 589824
    cond_frames: 1
    cond_frames_dist:
      1: 1
    shortcut_anchor_prob: 0.6
    shortcut_step_schedule:
      units: normalized
      mode: log2
      min: 1/128
      max: 1
      base: 2
    eval_step_schedule:
      - {num_steps: 1,  step_level: 1.0}
      - {num_steps: 2,  step_level: 0.5}
      - {num_steps: 4,  step_level: 0.25}
      - {num_steps: 8,  step_level: 0.125}
      - {num_steps: 25, step_level: 0.04}
      - {num_steps: 50, step_level: 0.02}

    wandb:
      enable: true
      require_vae: false
      project: Wan2.2-shortcut-only-metaworld
      num_samples: 3
      fps: 3
