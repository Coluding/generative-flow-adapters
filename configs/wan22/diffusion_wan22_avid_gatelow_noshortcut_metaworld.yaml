# Wan2.2-TI2V-5B (flow matching, diffusion forcing) + AVID-style action adapter
# (AdaLN injection), gate + optimizer confounds fixed, shortcut self-consistency
# OFF.
#
# Identical to diffusion_wan22_avid_gatelow_metaworld.yaml (the 2026-07-15
# controlled-retest baseline) with exactly one change:
#   shortcut_anchor_prob: 0.6 -> 1.0   (every step is an anchor step, so the
#     trainer never synthesises a shortcut target -- see
#     Trainer._maybe_prepare_shortcut. Only the standard flow-matching loss
#     remains. Matches the mechanism the ORIGINAL, now-stale
#     diffusion_wan22_avid_i2v_metaworld_noshortcut.yaml used, but on the
#     current gate-fixed baseline instead of that drifted config -- see
#     thesis-vault exp-shortcut-zero-weight-control-run.md for why the old
#     file wasn't just patched (wrong script, temporal_length=121 vs 41,
#     256px "washed" resolution -- multiple unrelated mismatches, not just
#     composition/gate_bias).
#
# This is the shortcut-isolation control: does the shortcut self-consistency
# term interact badly with the composition/gate, independent of the
# gate-saturation fix? Run alongside diffusion_wan22_avid_gatelow_metaworld.yaml
# (shortcut ON) for the comparison.
#
# PREREQUISITES: Wan2.2-TI2V-5B DiT + Wan2.2_VAE.pth in the ckpt dir.
# Run with scripts/train_wan22_i2v_metaworld_EXTERNAL.py — NOT the plain
# train_wan22_i2v_metaworld.py (real weights only load there; see
# diffusion_wan22_dcunet_output_metaworld.yaml's header for why).

name: diffusion_wan22_avid_gatelow_noshortcut_metaworld

data:
  frame_stride: 1
  fs_value: 1
  val_fraction: 0.01
  # eval_hdf5: ds/metaworld_corner2_val.hdf5

model:
  type: flow
  provider: wan2.2
  prediction_type: velocity
  freeze: true
  # pretrained_model_name_or_path: ckpts/Wan2.2-TI2V-5B
  extra:
    wan_config_path: configs/base/wan2.2_ti2v_5B.yaml
    allow_missing_checkpoint: true
    dtype: bf16
    latent_channels: 48
    temporal_length: 41     # pixel-frame window -> 11 latent frames (t_lat = 1 + (41-1)/4)
    max_area: 589824         # 704 * 1280
    latent_height: 16
    latent_width: 16
    text_prompts_file: configs/prompts/metaworld_tasks.yaml   # null -> frame-only (no text)

adapter:
  type: output
  hidden_dim: 256
  feature_dim: 48            # Wan2.2 latent channel count
  composition: mask_mix      # AVID prediction-blend: base*σ(gate) + pred*(1-σ(gate))
  gate_bias: 0.0              # σ(0)=0.5 -> balanced 50/50 at init (AVID-matched)
  extra:
    backbone: wan            # AVID-style: a small action-conditioned Wan DiT
    wan_adapter_config_path: configs/base/wan_adapter_34m.yaml
    condition_on_base_outputs: true
    use_step_level_conditioning: true
    step_level_key: step_level
    step_level_transform: log2
    action_dropout_prob: 0.0

conditioning:
  type: action
  input_dim: 4             # MetaWorld action dimension
  output_dim: 512
  drop_condition_prob: 0.0

training:
  loss: flow_matching
  learning_rate: 1.0e-4
  grad_clip_norm: 1.0
  grad_accum_steps: 4          # effective batch 8 at --batch-size 2 (matches pg3x72uc)
  linear_warmup_steps: 250     # matches AVID's active warmup
  shortcut_direction_weight: 1.0       # inert here -- anchor_prob=1.0 means no shortcut target is ever built
  shortcut_target_method: distillation
  inference_every_n_steps: 300
  eval_every_n_steps: 5
  quality_metrics: [psnr, ssim, lpips, mse]
  quality_eval_num_batches: 4
  quality_eval_num_steps: 1
  quality_dist_metrics: [fvd, fid]
  quality_dist_every_n_steps: 5
  quality_dist_num_batches: 4

  extra:
    amp_dtype: bf16
    use_batch_timesteps_for_flow: true
    flow_timestep_scale: 1000
    inference_guide_scale: 5.0
    inference_shift: 5.0
    inference_use_prompt: true
    inference_frame_num: 41
    inference_seed: 0
    inference_max_area: 589824
    cond_frames: 1
    cond_frames_dist:
      1: 1
    shortcut_anchor_prob: 1.0   # <-- the only change vs the shortcut-ON sibling: 100% anchor, shortcut term never fires
    shortcut_step_schedule:
      units: normalized
      mode: log2
      min: 1/128
      max: 1
      base: 2
    eval_step_schedule:
      - {num_steps: 1,  step_level: 1.0}
      - {num_steps: 2,  step_level: 0.5}
      - {num_steps: 4,  step_level: 0.25}
      - {num_steps: 8,  step_level: 0.125}
      - {num_steps: 25, step_level: 0.04}
      - {num_steps: 50, step_level: 0.02}

    wandb:
      enable: true
      require_vae: false
      project: Wan2.2-avid-gatelow-noshortcut-i2v-metaworld
      num_samples: 3
      fps: 3
