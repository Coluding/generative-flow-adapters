# ACWM-Phys Robot Arm (HF t1an/ACWM-Phys, kinematics/robot_arm) — the
# VISUALLY-RICH, high-action-dimension env for the D2 study.
#
# WHY Robot Arm (2026-07-25): on Push Cube the frozen base sat at denoise loss
# ~0.036 (vs MetaWorld ~5.4) — the flat white-background vector graphics make
# standard MSE background-dominated, so the action-dependent square motion is a
# rounding error and the adapter clones the base. Robot Arm is realistic 3D
# Isaac Sim renders with a 7-DoF Franka Panda arm filling the frame, so the
# base has a real residual to leave for the adapter. da=7 also exercises the
# cross-attention injection choice (the ACWM paper finds xattn helps at high
# da). See thesis-vault 30_Knowledge/writing/ablation-axes.md.
#
# Data facts (verified 2026-07-25): kinematics/robot_arm, ~2000 ind_train
# episodes, fixed 128 frames @ 10 fps, released at 480x640 (4:3 landscape, NOT
# square like Push Cube). Actions [128, 7] joint-angle deltas (~[-0.19, 0.18]).
# temporal_length 97 = 4*24+1 -> 25 latent frames, 32 valid window starts.
# max_area 589824 -> aspect-preserving ~864x640 landscape (best_output_size),
# closer to Wan's natural regime than Push Cube's flat square. NO letterbox.
#
# PENDING before training (not before precompute — latents are text-free):
#   1. base-coherence probe: does the frozen Wan base produce coherent video on
#      the realistic-3D arm domain? (likely EASIER than Push Cube's flat art.)
#   2. T5 prompt precompute for configs/prompts/acwm_robotarm.yaml:
#        python external_repos/Wan2.2/precompute_prompt_contexts.py \
#          --ckpt_dir ckpts/Wan2.2-TI2V-5B --prompts_file configs/prompts/acwm_robotarm.yaml

name: diffusion_wan22_shortcut_actionfree_robotarm

# ACTION-FREE SHORTCUT (D3): step-size-conditioned few-step generation, NO action.
# action_dropout_prob 1.0 (adapter always nulls action tokens) + drop_condition_prob
# 1.0 (encoder always nulls the aggregated action) => the adapter sees ONLY the
# step-size d. Full few-step recipe: shortcut_direction + multistep self-consistency.

data:
  frame_stride: 1
  fs_value: 1
  val_fraction: 0.01

model:
  type: flow
  provider: wan2.2
  prediction_type: velocity
  freeze: true
  # pretrained_model_name_or_path: ckpts/Wan2.2-TI2V-5B
  extra:
    wan_config_path: configs/base/wan2.2_ti2v_5B.yaml
    allow_missing_checkpoint: true
    dtype: bf16
    latent_channels: 48
    temporal_length: 97       # 128-frame episodes: 97-frame windows (25 latent frames), 32 valid starts
    max_area: 589824          # ~864x640 landscape (4:3 source, aspect-preserving; no letterbox)
    latent_height: 16
    latent_width: 16
    text_prompts_file: configs/prompts/acwm_robotarm.yaml

adapter:
  type: output
  hidden_dim: 256
  feature_dim: 48
  composition: mask_mix
  gate_bias: 0.0
  gate_cap: 0.5             # matched to the live pushblock run (2026-07-27); was 0.9
  pretrain_steps: 0         # action-free: AVID action-pure warmup is irrelevant
  extra:
    backbone: wan
    wan_adapter_config_path: configs/base/wan_adapter_34m.yaml
    condition_on_base_outputs: true
    use_step_level_conditioning: true
    step_level_key: step_level
    step_level_transform: log2
    action_dropout_prob: 1.0   # ACTION-FREE: always null the action tokens
    action_injection: cross_attention
    action_max_len: 128

conditioning:
  type: action
  input_dim: 7              # ACWM-Phys robot_arm: 7-DoF per-joint angle deltas
  output_dim: 512
  drop_condition_prob: 1.0   # ACTION-FREE: always null the aggregated action

training:
  loss: flow_matching
  learning_rate: 1.0e-4
  grad_clip_norm: 1.0
  output_dir: outputs/wan-shortcut-actionfree-robotarm
  checkpoint_every_n_steps: 200
  keep_last_checkpoints: 3
  shortcut_direction_weight: 1.0
  multistep_consistency_weight: 1.0     # THE self-consistency term (few-step D3)
  shortcut_consistency_target: v_average
  shortcut_target_method: distillation
  inference_every_n_steps: 200
  eval_every_n_steps: 400
  quality_metrics: [psnr, ssim, lpips, mse]
  quality_eval_num_batches: 1
  quality_eval_num_steps: 10
  quality_dist_metrics: [fvd, fid]
  quality_dist_every_n_steps: 400
  quality_dist_num_batches: 1
  baseline_eval_inference: true
  baseline_eval_loss: false
  baseline_eval_quality: false

  extra:
    amp_dtype: bf16
    # Action diagnostics: forward-direction sensitivity probe (runs each eval cycle).
    # Backward-direction grad-norms (adapter/condition/action_inject) auto-log every step.
    action_sensitivity_probe: false   # action-free — nothing to probe
    action_sensitivity_variants: [shuffle, zero]
    action_sensitivity_draws: 2
    action_sensitivity_batches: 2
    use_batch_timesteps_for_flow: true
    flow_timestep_scale: 1000
    sigma_shift: 5.0          # train-only; eval stays U(0,1)
    inference_guide_scale: 5.0
    inference_shift: 5.0
    inference_use_prompt: true
    inference_frame_num: 97
    inference_seed: 0
    inference_max_area: 589824
    cond_frames: 1
    cond_frames_dist:
      1: 1
    action_per_frame: false
    shortcut_anchor_prob: 0.5   # <1 so shortcut/consistency targets are actually built
    shortcut_step_schedule:
      units: normalized
      mode: log2
      min: 1/128
      max: 1
      base: 2
    eval_step_schedule:
      - {num_steps: 1,  step_level: 1.0}
      - {num_steps: 2,  step_level: 0.5}
      - {num_steps: 4,  step_level: 0.25}
      - {num_steps: 8,  step_level: 0.125}
      - {num_steps: 25, step_level: 0.04}
      - {num_steps: 50, step_level: 0.02}

    wandb:
      enable: true
      require_vae: false
      project: Wan2.2-shortcut-actionfree-acwm-robotarm
      num_samples: 3
      fps: 5
