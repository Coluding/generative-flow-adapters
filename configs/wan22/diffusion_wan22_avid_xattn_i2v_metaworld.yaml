# Wan2.2-TI2V-5B (flow matching, diffusion forcing) + AVID-style action adapter,
# CROSS-ATTENTION action injection variant.
#
# Identical to diffusion_wan22_avid_i2v_metaworld.yaml EXCEPT the action enters
# the tiny Wan DiT adapter through its (previously unused) t2v cross-attention as
# per-frame action tokens, instead of the global AdaLN broadcast. Timestep +
# step_level still go through AdaLN. This is the cross-attention arm of the
# action-conditioning-injection ablation:
#   adapter.extra.action_injection: adaln | cross_attention | both
# Flip that one knob for the other arms; everything else is held fixed.
#
# The per-frame action tokens come from the preprocessor's cond["action_seq"]
# ([B, L, 4], raw delta-actions). Run with scripts/train_wan22_i2v_metaworld.py.
#
# PREREQUISITES: Wan2.2-TI2V-5B DiT + Wan2.2_VAE.pth in the ckpt dir.

name: diffusion_wan22_avid_xattn_i2v_metaworld

data:
  frame_stride: 1
  fs_value: 1
  val_fraction: 0.01
  # eval_hdf5: ds/metaworld_corner2_val.hdf5

model:
  type: flow
  provider: wan2.2
  prediction_type: velocity
  freeze: true
  # pretrained_model_name_or_path: ckpts/Wan2.2-TI2V-5B
  extra:
    wan_config_path: configs/base/wan2.2_ti2v_5B.yaml
    allow_missing_checkpoint: true
    dtype: bf16
    latent_channels: 48
    temporal_length: 97     # pixel-frame window -> 11 latent frames (t_lat = 1 + (41-1)/4)
    max_area: 589824         # 704 * 1280
    latent_height: 16
    latent_width: 16
    text_prompts_file: configs/prompts/metaworld_tasks.yaml   # null -> frame-only (no text)

adapter:
  type: output
  hidden_dim: 256
  feature_dim: 48            # Wan2.2 latent channel count
  composition: mask_mix      # AVID prediction-blend: base*σ(gate) + pred*(1-σ(gate))
  gate_bias: 4.0             # σ(0+4)≈0.982 -> mask starts ≈1 (keep base) for identity-at-init
  extra:
    backbone: wan            # AVID-style: a small action-conditioned Wan DiT
    wan_adapter_config_path: configs/base/wan_adapter_34m.yaml
    condition_on_base_outputs: true
    use_step_level_conditioning: true
    step_level_key: step_level
    step_level_transform: log2
    action_dropout_prob: 0.0
    # --- action-conditioning injection (this is the only real change) ---
    action_injection: cross_attention   # adaln | cross_attention | both
    action_max_len: 128                  # positional-embedding capacity for action tokens
    # action_token_key: action_seq      # (default) per-frame tokens from the preprocessor

conditioning:
  type: action
  input_dim: 4             # MetaWorld action dimension (also the per-token width)
  output_dim: 512
  drop_condition_prob: 0.0

training:
  loss: flow_matching
  learning_rate: 1.0e-4
  grad_clip_norm: 1.0
  shortcut_direction_weight: 1.0       # shortcut self-consistency supervision (masked to predicted frames)
  shortcut_target_method: distillation
  inference_every_n_steps: 300
  eval_every_n_steps: 300
  quality_metrics: [psnr, ssim, lpips, mse]
  quality_eval_num_batches: 4
  quality_eval_num_steps: 1
  quality_dist_metrics: [fvd, fid]
  quality_dist_every_n_steps: 300
  quality_dist_num_batches: 4

  extra:
    amp_dtype: bf16
    use_batch_timesteps_for_flow: true
    flow_timestep_scale: 1000
    inference_guide_scale: 5.0
    inference_shift: 5.0
    inference_use_prompt: true
    inference_frame_num: 97
    inference_seed: 0
    inference_max_area: 589824
    cond_frames: 1
    cond_frames_dist:
      1: 1
    shortcut_anchor_prob: 0.6
    shortcut_step_schedule:
      units: normalized
      mode: log2
      min: 1/128
      max: 1
      base: 2
    eval_step_schedule:
      - {num_steps: 1,  step_level: 1.0}
      - {num_steps: 2,  step_level: 0.5}
      - {num_steps: 4,  step_level: 0.25}
      - {num_steps: 8,  step_level: 0.125}
      - {num_steps: 25, step_level: 0.04}
      - {num_steps: 50, step_level: 0.02}

    wandb:
      enable: true
      require_vae: false
      project: Wan2.2-avid-xattn-i2v-metaworld
      num_samples: 3
      fps: 3
