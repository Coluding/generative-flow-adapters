# Wan2.2-TI2V-5B (flow matching, diffusion forcing) + AVID-style action adapter,
# CROSS-ATTENTION action injection, FULL ADAPTER REPLACEMENT (composition:
# replace). The "crazy experiment" diagnostic — see thesis-vault
# feat-adapter-dynamicrafter-output-on-wan-base.md §"Crazy experiment" for the
# DC-UNet version of this idea — applied here to the tiny Wan DiT adapter.
#
# f = f_base + g(d)*Δ_φ  (the thesis rule)  -->  f = Δ_φ(x_t, t, a_t, base_output)
# for THIS diagnostic run only. The base is still given to the adapter as an
# INPUT (condition_on_base_outputs: true, unchanged) -- only the OUTPUT
# composition changes (composition: replace, an existing _compose branch,
# adapted_model.py:159-160 -- no new code). Isolates gradient-flow/optimization
# from the mask_mix gate throttle, same spirit as the DC-UNet replace run.
#
# IMPORTANT DIFFERENCE from the DC-UNet replace experiment: the Wan tiny-DiT
# adapter's final layer IS zero-initialised (Wan21OutputAdapter's own docstring:
# "its head is zero-initialised, so the delta is ~0 at init"), unlike the
# DC-UNet's final conv (NOT zero-init). So under `replace` here, the adapter's
# FIRST prediction is literally the zero tensor -- a different, more standard
# cold start than the DC-UNet run's untrained-but-nonzero output. Expect the
# initial loss to reflect "predict zero velocity everywhere" (~ the variance of
# the true target velocity), then descend as the zero-init head bootstraps away
# from zero. Not a bug -- just a different starting regime, worth not confusing
# with the DC-UNet replace run's numbers.
#
# Also fixes the same action_seq_len / unbinned-cross-attention-token bug as
# diffusion_wan22_avid_xattn_gatelow_metaworld.yaml (action_per_frame: true).
# gate_bias is irrelevant here -- `replace` has no gate at all.
#
# NOT a proposed final architecture -- throws away the plug-and-play
# composition (f_base + g*Δ) that is the thesis contribution. Diagnostic only;
# don't report its numbers as D2/D4 evidence.
#
# Run with scripts/train_wan22_i2v_metaworld_EXTERNAL.py — NOT the plain
# train_wan22_i2v_metaworld.py (real weights + action_per_frame wiring only
# exist there; see diffusion_wan22_dcunet_output_metaworld.yaml's header).
#
# PREREQUISITES: Wan2.2-TI2V-5B DiT + Wan2.2_VAE.pth in the ckpt dir.

name: diffusion_wan22_avid_xattn_replace_metaworld

data:
  frame_stride: 1
  fs_value: 1
  val_fraction: 0.01
  # eval_hdf5: ds/metaworld_corner2_val.hdf5

model:
  type: flow
  provider: wan2.2
  prediction_type: velocity
  freeze: true
  # pretrained_model_name_or_path: ckpts/Wan2.2-TI2V-5B
  extra:
    wan_config_path: configs/base/wan2.2_ti2v_5B.yaml
    allow_missing_checkpoint: true
    dtype: bf16
    latent_channels: 48
    temporal_length: 97     # pixel-frame window -> 11 latent frames (t_lat = 1 + (41-1)/4)
    max_area: 589824         # 704 * 1280
    latent_height: 16
    latent_width: 16
    text_prompts_file: configs/prompts/metaworld_tasks.yaml   # null -> frame-only (no text)

adapter:
  type: output
  hidden_dim: 256
  feature_dim: 48            # Wan2.2 latent channel count
  composition: replace       # f = Δ_φ only -- base bypassed at output (input still sees it)
  extra:
    backbone: wan            # AVID-style: a small action-conditioned Wan DiT
    wan_adapter_config_path: configs/base/wan_adapter_34m.yaml
    condition_on_base_outputs: true   # base_output still concatenated as INPUT
    use_step_level_conditioning: false
    step_level_key: step_level
    step_level_transform: log2
    action_dropout_prob: 0.0
    # --- action-conditioning injection ---
    action_injection: cross_attention   # adaln | cross_attention | both
    action_max_len: 128                  # positional-embedding capacity for action tokens
    # action_token_key: action_seq      # (default) per-frame tokens from the preprocessor


conditioning:
  type: action
  input_dim: 4             # MetaWorld action dimension (also the per-token width)
  output_dim: 512
  drop_condition_prob: 0.0

training:
  loss: flow_matching
  learning_rate: 1.0e-4
  grad_clip_norm: 1.0
  output_dir: outputs/replace-metaworld-run   # checkpoints land in outputs/replace-metaworld-run/checkpoints/
  checkpoint_every_n_steps: 500               # step-tagged saves
  keep_last_checkpoints: 3
  shortcut_direction_weight: 1.0       # shortcut self-consistency supervision (masked to predicted frames)
  shortcut_target_method: distillation
  inference_every_n_steps: 300
  eval_every_n_steps: 300
  quality_metrics: [psnr, ssim, lpips, mse]
  quality_eval_num_batches: 4
  quality_eval_num_steps: 10
  quality_dist_metrics: [fvd, fid]
  quality_dist_every_n_steps: 300
  quality_dist_num_batches: 4

  extra:
    amp_dtype: bf16
    use_batch_timesteps_for_flow: true
    flow_timestep_scale: 1000
    # Timestep shift (SD3/Wan convention, sigma' = s*sigma/(1+(s-1)*sigma)):
    # concentrates training noise levels toward high sigma, where the future is
    # least determined by x_t and action information actually carries loss
    # signal. Matches Wan's own pretraining shift (5.0) and the ACWM-DiT recipe.
    # Motivated by the 2026-07-21 per-sigma sweep (base-parity at every sigma
    # under unshifted U(0,1) training). Train-time only; eval stays U(0,1).
    sigma_shift: 5.0
    inference_guide_scale: 5.0
    inference_shift: 5.0
    inference_use_prompt: true
    inference_frame_num: 97
    inference_seed: 0
    inference_max_area: 589824
    cond_frames: 1
    cond_frames_dist:
      1: 1
    # Pins action_seq_len to the latent frame count (11) -- fixes the
    # unbinned/unmasked cross-attention token bug from the original xattn run.
    action_per_frame: false
    shortcut_anchor_prob: 1.0
    shortcut_step_schedule:
      units: normalized
      mode: log2
      min: 1/128
      max: 1
      base: 2
    eval_step_schedule:
      - {num_steps: 1,  step_level: 1.0}
      - {num_steps: 2,  step_level: 0.5}
      - {num_steps: 4,  step_level: 0.25}
      - {num_steps: 8,  step_level: 0.125}
      - {num_steps: 25, step_level: 0.04}
      - {num_steps: 50, step_level: 0.02}

    wandb:
      enable: true
      require_vae: false
      project: Wan2.2-avid-xattn-replace-i2v-metaworld
      num_samples: 3
      fps: 5
