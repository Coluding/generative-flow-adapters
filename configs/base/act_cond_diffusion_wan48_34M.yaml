# DynamiCrafter-style 3D-UNet output adapter, sized for the Wan2.2 base — 34M tier.
#
# WAN-adapted copy of act_cond_diffusion_34M.yaml. Only
# `model.params.unet_config.params` (+ schedule fields) are read by the output-
# adapter factory; the AVID autoencoder / CLIP / lightning blocks are dropped.
# See act_cond_diffusion_wan48_145M.yaml for the full rationale + 3-point
# smoke-test checklist — this file differs from it ONLY in the capacity tier.
#
# Deltas vs act_cond_diffusion_34M.yaml (all WAN-specific, identical to the 145M
# port): in_channels 8->48, out_channels 4->48, temporal_length 16->11,
# image_cross_attention true->false, addition_attention true->false.
#
# CAPACITY: model_channels 64 (34M tier). NOTE this is ~the same size as the
# current AVID Wan adapter (wan_adapter_34m), so it is NOT a capacity increase —
# use it as a size-matched control, not the capacity test (that's the 145M tier).
#
# Downsample factor: channel_mult [1,1,2,3] = 3 downsamples = 8 (same as 145M).

model:
  params:
    parameterization: "v"
    linear_start: 0.00085
    linear_end: 0.012
    timesteps: 1000
    rescale_betas_zero_snr: True

    unet_config:
      target: lvdm.modules.networks.openaimodel3d.UNetModel
      params:
        action_conditioned: True
        action_dropout_prob: 0.0
        use_scale_shift_norm: True
        in_channels: 48          # Wan2.2 latent width (adapter -> 96 with base-output concat)
        out_channels: 48         # emit the Wan-space delta
        model_channels: 64       # 34M tier (~= current wan_adapter_34m, i.e. size-matched control)
        attention_resolutions:
          - 4
          - 2
          - 1
        num_res_blocks: 2
        channel_mult:
          - 1
          - 1
          - 2
          - 3
        dropout: 0.1
        num_head_channels: 64
        transformer_depth: 1
        context_dim: 1024
        use_linear: true
        use_checkpoint: True
        temporal_conv: True
        temporal_attention: True
        temporal_selfatt_only: true
        use_relative_position: false
        use_causal_attention: False
        temporal_length: 11      # 1 + (41-1)/4 Wan2.2 latent frames
        addition_attention: false # DC image-context attn — off on a WAN base
        image_cross_attention: false # no CLIP-image context on a WAN base
        default_fs: 10
        fs_condition: false
