# DynamiCrafter-style 3D-UNet output adapter, sized for the Wan2.2 base.
#
# This is act_cond_diffusion_145M.yaml adapted to sit as Δ_φ on the FROZEN
# Wan2.2-TI2V-5B flow base (see configs/diffusion_wan22_dcunet_output_metaworld.yaml).
# Only `model.params.unet_config.params` is consumed by the output-adapter
# factory (DynamicCrafterOutputAdapter._load_unet_params) — the AVID
# autoencoder / CLIP / lightning blocks are NOT loaded here, so they are dropped.
#
# The "WAN↔DC latent bridge" is a CHANNEL setting, not a projection layer: the
# openaimodel3d UNet is fully-convolutional in the channel dim, so pointing
# in/out_channels at the Wan2.2-VAE latent width (z_dim = 48) is the whole bridge.
#
# Deltas vs act_cond_diffusion_145M.yaml (all WAN-specific):
#   in_channels   8  -> 48   (Wan2.2 latent width; the adapter internally bumps
#                             this to 96 = 48 x_t + 48 base_output because the
#                             training config sets condition_on_base_outputs: true)
#   out_channels  4  -> 48   (emit a delta in Wan velocity/latent space)
#   temporal_length 16 -> 11 (41-pixel-frame window -> 1 + (41-1)/4 latent frames)
#   image_cross_attention true -> false  (no DynamiCrafter CLIP-image context on a
#                                         WAN base; action enters via adapter_embedding)
#   addition_attention    true -> false  (that path is the DC image-context attn)
#   fs_condition          false (unchanged; no fps conditioning)
#
# CAPACITY: model_channels 96 (145M-tier). This is the point — the current AVID
# Wan adapter (wan_adapter_34m) is only 34M, so a same-size DC-UNet would NOT test
# the capacity hypothesis. Drop model_channels to 64 (34M-tier) only to fit VRAM.
#
# NOT YET SMOKE-VALIDATED. Before trusting this config, the random-weight smoke run
# (examples/wan22_generate_cond_frames.py-style) must confirm THREE things:
#   1. Spatial latent dims are divisible by the UNet downsample factor. channel_mult
#      [1,2,4,4] = 3 downsamples = factor 8. Square MetaWorld @768px -> 48x48 latent
#      -> 48/8 ✓. A NON-square Wan `best_output_size` latent may not divide by 8 —
#      if it fails, drop channel_mult to [1,2,4] (factor 4).
#   2. The spatial-transformer cross-attn blocks tolerate context=None (self-attn
#      fallback) now that image_cross_attention is off — no CLIP context is fed.
#   3. The wan22 training path routes the action condition encoder's output to the
#      adapter's `embedding` (adapter_embedding) key that this UNet consumes.

model:
  params:
    # Read by DynamicCrafterOutputAdapter._load_diffusion_schedule_config. For a
    # FLOW base (flow_matching loss) these are effectively inert, kept valid.
    parameterization: "v"
    linear_start: 0.00085
    linear_end: 0.012
    timesteps: 1000
    rescale_betas_zero_snr: True

    unet_config:
      target: lvdm.modules.networks.openaimodel3d.UNetModel
      params:
        action_conditioned: True
        action_dropout_prob: 0.0
        use_scale_shift_norm: True
        in_channels: 48          # Wan2.2 latent width (adapter -> 96 with base-output concat)
        out_channels: 48         # emit the Wan-space delta
        model_channels: 96       # 145M-tier capacity (drop to 64 for 34M-tier / VRAM)
        attention_resolutions:
          - 4
          - 2
          - 1
        num_res_blocks: 2
        channel_mult:
          - 1
          - 2
          - 4
          - 4
        dropout: 0.1
        num_head_channels: 64
        transformer_depth: 1
        context_dim: 1024
        use_linear: true
        use_checkpoint: True
        temporal_conv: True
        temporal_attention: True
        temporal_selfatt_only: true
        use_relative_position: false
        use_causal_attention: False
        temporal_length: 11      # 1 + (41-1)/4 Wan2.2 latent frames
        addition_attention: false # DC image-context attn — off on a WAN base
        image_cross_attention: false # no CLIP-image context on a WAN base
        default_fs: 10
        fs_condition: false
