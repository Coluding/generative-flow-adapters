# Wan2.2-TI2V-5B (flow matching, diffusion forcing) + action-conditioned output
# adapter, trained on the MetaWorld HDF5 dataset as an action-conditioned world
# model.
#
# The frozen Wan2.2 TI2V base does the *observation* conditioning natively: the
# first latent frame is held clean (timestep 0) and the future frames are
# denoised from it ("diffusion forcing" — no CLIP, no concat). The trainable
# adapter adds the *action* conditioning. Latent geometry is Wan2.2-VAE:
# 48 channels, stride (4, 16, 16).
#
# PREREQUISITES for a real run: Wan2.2-TI2V-5B DiT + Wan2.2_VAE.pth in the ckpt
# dir. Until then allow_missing_checkpoint runs with random base weights.

name: diffusion_wan22_i2v_metaworld

data:
  frame_stride: 4
  fs_value: 1

model:
  type: flow
  provider: wan2.2
  prediction_type: velocity
  freeze: true
  # pretrained_model_name_or_path: ckpts/Wan2.2-TI2V-5B
  extra:
    wan_config_path: configs/base/wan2.2_ti2v_5B.yaml
    allow_missing_checkpoint: true
    dtype: bf16
    # Wan2.2-VAE latent geometry (vae_stride = (4, 16, 16), z_dim = 48).
    latent_channels: 48
    temporal_length: 17      # pixel-frame window -> 5 latent frames at stride 4
    latent_height: 16        # 256 px / 16
    latent_width: 16

adapter:
  type: output
  hidden_dim: 512
  feature_dim: 48            # Wan2.2 latent channel count
  extra:
    architecture: output_head
    backbone: transformer    # DiT-style head over the 5D latent
    output_format: direct
    condition_on_base_outputs: true
    patch_size: 2
    num_layers: 4
    num_heads: 8

conditioning:
  type: action
  input_dim: 4             # MetaWorld action dimension
  output_dim: 512
  drop_condition_prob: 0.0

training:
  loss: flow_matching
  learning_rate: 1.0e-4
  grad_clip_norm: 1.0
  # v1 of the I2V world model: plain diffusion-forcing flow loss (velocity on the
  # predicted frames). Shortcut self-consistency on top of diffusion forcing is a
  # separate extension — kept off here.
  shortcut_direction_weight: 0.0
  # Eval video logging: the diffusion-forcing sampler clamps the observation
  # frame each step and feeds a per-frame timestep, so the panel shows
  # [GT | base | adapted] future-prediction conditioned on the real first frame.
  inference_every_n_steps: 2000
  inference_num_steps: 50
  extra:
    amp_dtype: bf16                  # autocast (NOT model dtype) — see bf16 memory note
    use_batch_timesteps_for_flow: true  # use the (x_t,t,target) the diffusion-forcing preprocessor builds
    flow_timestep_scale: 1000            # model fed t = sigma*scale (Wan native [0,1000])
    cond_frames: 1                       # number of leading observation frames held clean
    wandb:
      enable: true
      require_vae: false                # Wan2.2-VAE injected at runtime (no decode_first_stage on the DiT)
      project: wan22-i2v-metaworld
      num_samples: 2
      fps: 8
