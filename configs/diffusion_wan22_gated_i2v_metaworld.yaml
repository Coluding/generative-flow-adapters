# Wan2.2-TI2V-5B (flow matching, diffusion forcing) + action adapter with a
# GATED-RESIDUAL mask. A/B sibling of diffusion_wan22_avid_i2v_metaworld.yaml:
# IDENTICAL in every respect except the composition.
#
#   mask_mix       (avid config):  base*σ(gate) + pred*(1-σ(gate))   [replace]
#   gated_residual (this config):  base + σ(gate)*Δ                  [correct]
#
# Here the adapter emits a ~0-init delta plus a learned per-pixel gate deciding
# where/how much of the residual to apply. Identity-at-init is free (Δ≈0), so no
# gate_bias is needed. The frozen base's prediction is never discarded.
#
# Run with scripts/train_wan22_i2v_metaworld_external.py (or _metaworld.py).
# PREREQUISITES: Wan2.2-TI2V-5B DiT + Wan2.2_VAE.pth in the ckpt dir.

name: diffusion_wan22_gated_i2v_metaworld

data:
  frame_stride: 1
  fs_value: 1
  val_fraction: 0.01
  # eval_hdf5: ds/metaworld_corner2_val.hdf5

model:
  type: flow
  provider: wan2.2
  prediction_type: velocity
  freeze: true
  # pretrained_model_name_or_path: ckpts/Wan2.2-TI2V-5B
  extra:
    wan_config_path: configs/base/wan2.2_ti2v_5B.yaml
    allow_missing_checkpoint: true
    dtype: bf16
    # Wan2.2-VAE latent geometry (vae_stride = (4, 16, 16), z_dim = 48).
    latent_channels: 48
    temporal_length: 41     # pixel-frame window -> 11 latent frames (t_lat = 1 + (41-1)/4)
    max_area: 589824         # 704 * 1280
    latent_height: 16
    latent_width: 16
    text_prompts_file: configs/prompts/metaworld_tasks.yaml   # null -> frame-only (no text)

adapter:
  type: output
  hidden_dim: 256
  feature_dim: 48            # Wan2.2 latent channel count
  composition: gated_residual  # base + σ(gate)*Δ  (identity-at-init from Δ≈0, no gate_bias)
  extra:
    backbone: wan            # a small action-conditioned Wan DiT delta
    wan_adapter_config_path: configs/base/wan_adapter_34m.yaml
    condition_on_base_outputs: true
    use_step_level_conditioning: true
    step_level_key: step_level
    step_level_transform: log2
    action_dropout_prob: 0.0

conditioning:
  type: action
  input_dim: 4             # MetaWorld action dimension
  output_dim: 512
  drop_condition_prob: 0.0

training:
  loss: flow_matching
  learning_rate: 1.0e-4
  grad_clip_norm: 1.0
  shortcut_direction_weight: 1.0       # shortcut self-consistency supervision (masked to predicted frames)
  shortcut_target_method: distillation
  inference_every_n_steps: 50
  eval_every_n_steps: 50
  quality_metrics: [psnr, ssim, lpips, mse]
  quality_eval_num_batches: 4
  quality_eval_num_steps: 10
  quality_dist_metrics: [fvd, fid]
  quality_dist_every_n_steps: 50
  quality_dist_num_batches: 4

  extra:
    amp_dtype: bf16                  # autocast (NOT model dtype) — see bf16 memory note
    use_batch_timesteps_for_flow: true  # use the (x_t,t,target) the diffusion-forcing preprocessor builds
    flow_timestep_scale: 1000            # model fed t = sigma*scale (Wan native [0,1000])
    inference_guide_scale: 5.0           # CFG at eval (the "much better" scale); needs a real prompt to bite
    inference_shift: 5.0                 # Wan2.2 TI2V-5B native flow shift (the legacy sampler used 3.0)
    inference_use_prompt: true           # condition the eval base on the task prompt (if text conditioning is on)
    inference_frame_num: 41            # null -> temporal_length (must be 4n+1)
    inference_seed: 0
    inference_max_area: 589824
    cond_frames: 1                       # eval/no-dist: leading observation frames held clean
    cond_frames_dist:
      1: 1
    shortcut_anchor_prob: 0.6            # P(anchor step: standard flow loss only, no shortcut target)
    shortcut_step_schedule:
      units: normalized
      mode: log2
      min: 1/128
      max: 1
      base: 2
    eval_step_schedule:
       - {num_steps: 50, step_level: 0.02}

    wandb:
      enable: true
      require_vae: false                # Wan2.2-VAE injected at runtime
      project: Wan2.2-gated-i2v-metaworld34
      num_samples: 3                    # three clips logged per eval grid
      fps: 3
