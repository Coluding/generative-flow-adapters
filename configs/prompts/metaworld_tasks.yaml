# Text prompts for conditioning the frozen Wan2.2 base — TASK-INDEPENDENT POOL.
#
# `default` + everything under `prompts:` form one pool. During training a single
# prompt is sampled at random per clip each step (augmentation); eval always uses
# `default` (element 0, deterministic). No task_name / per-task setup needed.
#
# Pipeline:
#   1. Precompute embeddings once (needs T5):
#        python external_repos/Wan2.2/precompute_prompt_contexts.py \
#          --ckpt_dir ckpts/Wan2.2-TI2V-5B \
#          --prompts_file configs/prompts/metaworld_tasks.yaml
#      -> writes configs/prompts/metaworld_tasks.contexts.pt
#   2. Point the config at THIS file: model.extra.text_prompts_file
#      (null -> disable text conditioning -> frame-only training).
#   Re-run step 1 after any prompt edit — training reads the .contexts.pt snapshot.
#
# `negative: null` uses the model's built-in sample_neg_prompt (Wan quality-negative)
# for the CFG unconditional branch.

default: "A robotic arm performs a manipulation task on a table, smooth realistic motion, sharp video, stable camera."

negative: null

# The sampling pool (sampled at random per clip during training):
prompts:
  - "A red robotic arm moves smoothly to manipulate objects on a table, sharp video, stable camera."
  - "A robot manipulator performs a precise tabletop task, steady camera, crisp realistic video, correct."
  - "A robot arm reaches and interacts with objects on a table, fluid realistic motion, sharp video."
  - "A robotic arm carries out a manipulation task in a simulated tabletop scene, smooth motion, clear video."
