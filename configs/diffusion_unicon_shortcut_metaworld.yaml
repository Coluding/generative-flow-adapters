name: diffusion_unicon_shortcut_metaworld

# UniCon Figure-3(d) hidden-state adapter on DynamiCrafter + shortcut
# self-consistency training on MetaWorld.
#
# Mirrors ``diffusion_unicon_metaworld.yaml`` but turns on the adapter-side
# step-level branch and the trainer's shortcut supervision: the trainer
# samples a random ``step_level`` per batch, injects it into the adapter's
# cond mapping, and uses base(x_t, t, cond) * step_level (or paper-faithful
# distillation, see ``shortcut_target_method`` below) as the shortcut target.
# The UniCon step-level branch consumes the same ``step_level`` so the
# adapter knows which multi-step horizon it is being trained for.

model:
  type: diffusion
  provider: dynamicrafter
  prediction_type: velocity
  freeze: true
  pass_cond_to_base: false
  include_base_condition: true
  extra:
    unet_config_path: external_repos/avid/latent_diffusion/configs/train/dynamicrafter_512.yaml
    latent_channels: 4
    latent_height: 16
    latent_width: 16
    temporal_length: 16
    allow_dummy_concat_condition: true
    allow_missing_checkpoint: true
    load_first_stage_model: true

adapter:
  type: hidden_state
  hidden_dim: 128
  composition: mask_mix
  gate_bias: 0.0
  extra:
    architecture: unicon
    connector_type: zeroft
    output_mask: true
    output_kind: prediction
    use_adapter_conditioning: true
    # Adapter-side step-level conditioning. The UniCon decoder mixes in a
    # learned embedding of ``cond[step_level]`` via the shared
    # ``prepare_dynamicrafter_condition`` helper. Must use the SAME key the
    # trainer is configured with (training.extra.shortcut_step_level_key).
    use_step_level_conditioning: true
    step_level_key: step_level
    step_level_hidden_dim: 64
    # `log2` feeds log2(s) into the Linear(1, ·) embed so the dyadic schedule
    # below spans a well-conditioned range (~[-7, 0]) instead of crushing the
    # fine end near zero. Use "linear" to feed s directly.
    step_level_transform: log2

conditioning:
  type: structured
  output_dim: 512
  drop_condition_prob: 0.05
  extra:
    context_tokens: 77
    context_dim: 1024
    temporal_length: 8
    action_dim: 4
    image_encoder_device: cuda
  conditions:
    - key: act
      input_dim: 4
      encoder: mlp
    # NOTE: step_level deliberately not in the structured-condition list.
    # The trainer puts a per-batch (B,) tensor under cond["step_level"]; the
    # StructuredConditionEncoder would try to concat that with per-frame act
    # (B,T,A) and crash on rank mismatch. UniCon's own
    # ``use_step_level_conditioning`` branch consumes cond["step_level"]
    # directly via its step_level_embed (Linear(1, ...)).

training:
  loss: diffusion
  learning_rate: 1.0e-4
  diffusion_timesteps: 1000
  grad_clip_norm: 1.0
  shortcut_direction_weight: 1.0
  # Shortcut target method. Only 'distillation' is supported; the former
  # 'two_step' (base-anchored Heun) mode was removed — see thesis-vault
  # deprecate-twostep-shortcut-mode. Its Heun construction survives as the
  # orthogonal `heun_smoothness_weight` regularizer.
  #   distillation  - Paper-faithful self-consistency (Frans et al. 2024).
  #                   With prob `shortcut_anchor_prob` run anchor mode
  #                   (step_level=1, standard diffusion loss); otherwise
  #                   supervise adapter at step_level=2d against the AVERAGE
  #                   of two no-grad adapter calls at step_level=d chained
  #                   across one d-sized DDIM micro-step. See thesis-vault
  #                   risk-shortcut-self-consistency-collapse for collapse
  #                   discussion.
  shortcut_target_method: distillation
  inference_every_n_steps: 5000
  inference_num_steps: 25
  extra:
    amp_dtype: bf16
    shortcut_step_level_key: step_level
    shortcut_step_level_min: 1
    shortcut_step_level_max: 4
    shortcut_anchor_prob: 0.75
    eval_step_schedule:
      - {num_steps: 1,  step_level: 1.0}
      - {num_steps: 2,  step_level: 0.5}
      - {num_steps: 4,  step_level: 0.25}
      - {num_steps: 25, step_level: 0.04}
    video_logging:
      enable: true
      num_samples: 2
      fps: 4
      wandb_project: unicon-shortcut-metaworld
