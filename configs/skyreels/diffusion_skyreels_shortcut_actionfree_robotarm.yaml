# ACWM-Phys Robot Arm on the SkyReels-V2-I2V-1.3B base (matrix run 3).
#
# SkyReels = WEAK flow base for the base-strength axis (Axis 5). Robot Arm is the
# visually-rich, high-action-dim (da=7) domain where the frozen base leaves a
# real residual (Wan base loss 0.314 at 17f vs Push Cube 0.036) — the clean arena
# for the base-strength comparison, since SkyReels' natural-video prior matches
# realistic 3D (it style-drifts on flat 2D). See thesis-vault
# 30_Knowledge/writing/ablation-axes.md.
#
# STATUS: RUNNABLE (2026-07-27). The SkyReels i2v batch preprocessor this
# config used to wait on now exists —
# generative_flow_adapters.data.skyreels_batch_preprocessor.SkyReelsI2VPreprocessor
# (z0 + y + clip_fea + context). Precompute verified on robot_arm; first
# training launch is job 24951643. Text is encoded live by SkyReels' own T5 —
# the Wan umT5 configs/prompts/*.contexts.pt are NOT reusable here.

name: diffusion_skyreels_shortcut_actionfree_robotarm

# ACTION-FREE SHORTCUT (D3): step-size-conditioned few-step generation, NO action.
# action_dropout_prob 1.0 + drop_condition_prob 1.0 => adapter sees ONLY step-size d.

data:
  frame_stride: 1
  fs_value: 1
  val_fraction: 0.01

model:
  type: flow
  provider: skyreels
  prediction_type: velocity
  freeze: true
  extra:
    model_id: Skywork/SkyReels-V2-I2V-1.3B-540P
    # model_path:  # optional local snapshot; else resolved from the HF cache
    dtype: bf16
    offload: true
    latent_channels: 16
    temporal_length: 97       # 128-frame episodes -> 97 = 4*24+1 -> 25 latent frames
    max_area: 196608          # ~512x384 landscape (stride-8; 4:3-ish, aspect-preserving)
    latent_height: 48         # 48 * 8 = 384 px
    latent_width: 64          # 64 * 8 = 512 px
    default_prompt: "a white multi-jointed robotic manipulator arm on a dark base over a gray tiled floor, realistic 3D render, the arm articulates toward a target, static camera, no people, no animals."

adapter:
  type: output
  hidden_dim: 256
  feature_dim: 16
  composition: mask_mix
  gate_bias: 0.0
  gate_cap: 0.9
  pretrain_steps: 0
  extra:
    backbone: wan
    wan_adapter_config_path: configs/base/wan_adapter_34m.yaml
    condition_on_base_outputs: true
    use_step_level_conditioning: true
    action_dropout_prob: 1.0   # ACTION-FREE
    action_injection: cross_attention
    action_max_len: 128

conditioning:
  type: action
  input_dim: 7               # ACWM-Phys robot_arm: 7-DoF per-joint angle deltas
  output_dim: 512
  drop_condition_prob: 1.0   # ACTION-FREE

training:
  loss: flow_matching
  learning_rate: 1.0e-4
  grad_clip_norm: 1.0
  output_dir: outputs/skyreels-shortcut-actionfree-robotarm
  # Eval cadence matched to the Wan runs (2026-07-27) so the Axis-5
  # base-strength comparison samples all three backbones on the same grid.
  checkpoint_every_n_steps: 200
  keep_last_checkpoints: 3
  shortcut_direction_weight: 1.0
  multistep_consistency_weight: 1.0
  shortcut_consistency_target: v_average
  shortcut_target_method: distillation
  inference_every_n_steps: 200
  eval_every_n_steps: 400
  quality_metrics: [psnr, ssim, lpips, mse]
  quality_eval_num_batches: 1
  quality_eval_num_steps: 10
  quality_dist_metrics: [fvd, fid]
  quality_dist_every_n_steps: 400
  quality_dist_num_batches: 1
  baseline_eval_inference: true
  baseline_eval_loss: false
  baseline_eval_quality: false

  extra:
    amp_dtype: bf16
    # Action diagnostics: forward-direction sensitivity probe (runs each eval cycle).
    # Backward-direction grad-norms (adapter/condition/action_inject) auto-log every step.
    action_sensitivity_probe: false
    action_sensitivity_variants: [shuffle, zero]
    action_sensitivity_draws: 2
    action_sensitivity_batches: 2
    use_batch_timesteps_for_flow: true
    flow_timestep_scale: 1000
    inference_guide_scale: 5.0
    inference_shift: 5.0
    inference_frame_num: 97
    # MUST mirror model.extra.max_area. Trainer._eval_gen_params falls back to
    # 704*1280 = 901120 when unset (trainer.py:927), which rendered the eval grid
    # at 1088x816 / 86,700 tokens while training runs 512x384 / 19,200 — 4.5x the
    # tokens and ~20x the attention work. That was BOTH the 9.38 s/it eval
    # rollouts and a correctness bug: quality metrics were measured at a
    # resolution the model never sees.
    inference_max_area: 196608
    inference_seed: 0
    cond_frames: 1
    action_per_frame: false
    # Matched to the Wan runs. step_level is inert here (the adapter sets
    # use_step_level_conditioning: false, as Wan does) — what this buys is the
    # 8-step and 50-step sampling grid, so SkyReels reports two quality points
    # per eval like DC/Wan instead of falling back to the single-point
    # [(inference_num_steps, None)] default in Trainer._eval_step_schedule().
    shortcut_anchor_prob: 0.5
    shortcut_step_schedule:
      units: normalized
      mode: log2
      min: 1/128
      max: 1
      base: 2
    eval_step_schedule:
      - {num_steps: 1,  step_level: 1.0}
      - {num_steps: 2,  step_level: 0.5}
      - {num_steps: 4,  step_level: 0.25}
      - {num_steps: 8,  step_level: 0.125}
      - {num_steps: 25, step_level: 0.04}
      - {num_steps: 50, step_level: 0.02}
    wandb:
      enable: true
      require_vae: false
      project: SkyReels-shortcut-actionfree-acwm-robotarm
      num_samples: 3
      fps: 5
