# ACWM-Phys Robot Arm on the SkyReels-V2-I2V-1.3B base (matrix run 3).
#
# SkyReels = WEAK flow base for the base-strength axis (Axis 5). Robot Arm is the
# visually-rich, high-action-dim (da=7) domain where the frozen base leaves a
# real residual (Wan base loss 0.314 at 17f vs Push Cube 0.036) — the clean arena
# for the base-strength comparison, since SkyReels' natural-video prior matches
# realistic 3D (it style-drifts on flat 2D). See thesis-vault
# 30_Knowledge/writing/ablation-axes.md.
#
# === DRAFT — NOT YET RUNNABLE FOR TRAINING ===
# Same caveat as the pushblock SkyReels config: needs the SkyReels i2v batch
# preprocessor (z0 + y + clip_fea + context) before precompute/training.
# generate() works via the native pipeline; text is encoded live by SkyReels' T5.

name: diffusion_skyreels_xattn_acwm_robotarm

data:
  frame_stride: 1
  fs_value: 1
  val_fraction: 0.01

model:
  type: flow
  provider: skyreels
  prediction_type: velocity
  freeze: true
  extra:
    model_id: Skywork/SkyReels-V2-I2V-1.3B-540P
    # model_path:  # optional local snapshot; else resolved from the HF cache
    dtype: bf16
    offload: true
    latent_channels: 16
    temporal_length: 97       # 128-frame episodes -> 97 = 4*24+1 -> 25 latent frames
    max_area: 196608          # ~512x384 landscape (stride-8; 4:3-ish, aspect-preserving)
    latent_height: 48         # 48 * 8 = 384 px
    latent_width: 64          # 64 * 8 = 512 px
    default_prompt: "a white multi-jointed robotic manipulator arm on a dark base over a gray tiled floor, realistic 3D render, the arm articulates toward a target, static camera, no people, no animals."

adapter:
  type: output
  hidden_dim: 256
  feature_dim: 16
  composition: mask_mix
  gate_bias: 0.0
  gate_cap: 0.9
  pretrain_steps: 0
  extra:
    backbone: wan
    wan_adapter_config_path: configs/base/wan_adapter_34m.yaml
    condition_on_base_outputs: true
    use_step_level_conditioning: false
    action_dropout_prob: 0.0
    action_injection: cross_attention
    action_max_len: 128

conditioning:
  type: action
  input_dim: 7               # ACWM-Phys robot_arm: 7-DoF per-joint angle deltas
  output_dim: 512
  drop_condition_prob: 0.0

training:
  loss: flow_matching
  learning_rate: 1.0e-4
  grad_clip_norm: 1.0
  output_dir: outputs/acwm-robotarm-skyreels-run
  checkpoint_every_n_steps: 500
  keep_last_checkpoints: 3
  inference_every_n_steps: 300
  eval_every_n_steps: 300
  quality_metrics: [psnr, ssim, lpips, mse]
  quality_eval_num_batches: 4

  extra:
    amp_dtype: bf16
    use_batch_timesteps_for_flow: true
    flow_timestep_scale: 1000
    inference_guide_scale: 5.0
    inference_shift: 5.0
    inference_frame_num: 97
    inference_seed: 0
    cond_frames: 1
    action_per_frame: false
    wandb:
      enable: true
      require_vae: false
      project: SkyReels-avid-xattn-acwm-robotarm
      num_samples: 3
      fps: 5
