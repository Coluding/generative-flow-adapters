name: diffusion_output_v2_affine_metaworld

# Output-format ablation (affine arm).
#
# A transformer output adapter on the frozen DynamiCrafter UNet. The adapter
# reads the detached base velocity (condition_on_base_outputs) and emits a
# per-channel AFFINE modulation of it: the backbone produces 2C channels split
# into (scale, shift), each POOLED to one value per channel, and the returned
# delta is base*scale + shift. Under `add` composition this realises
# prediction = base*(1 + scale) + shift — a cheap, structured FiLM on the base.
#
# Affine is channel-wise only by design: a dense per-element scale/shift map
# would make `shift` full-rank and subsume the direct delta, so the format would
# collapse into "direct + a redundant multiplicative term". (Hence there is no
# affine_granularity knob — see adapters/output/format.py and the thesis-vault
# note affine-output-granularity.)
#
# Pair this with `diffusion_output_v2_direct_metaworld.yaml` (identical except
# output_format: direct). The two arms test a difference in INDUCTIVE BIAS, not
# capacity: direct emits a free full-resolution residual; affine emits a cheap
# per-channel modulation of the frozen base. Same transformer trunk, only the
# readout structure differs.

model:
  type: diffusion
  provider: dynamicrafter
  prediction_type: velocity
  freeze: true
  pass_cond_to_base: true
  extra:
    unet_config_path: configs/base/dynamicrafter512.yaml
    strict_checkpoint: false
    latent_channels: 4
    latent_height: 16
    latent_width: 16
    temporal_length: 16
    allow_dummy_concat_condition: false
    allow_missing_checkpoint: true
    load_first_stage_model: true

adapter:
  type: output
  hidden_dim: 512
  composition: add
  extra:
    # type: output defaults to the DynamiCrafter adapter; `backbone` picks the form.
    backbone: transformer
    output_format: affine        # <-- the ablated axis (direct in the sibling config)
    condition_on_base_outputs: true
    # Transformer backbone hyperparameters (DiT-style over patchified latents).
    patch_size: 2
    num_layers: 6
    num_heads: 8

conditioning:
  type: structured
  output_dim: 512
  drop_condition_prob: 0.05
  extra:
    context_tokens: 77
    context_dim: 1024
    temporal_length: 8
    action_dim: 4
    image_encoder_device: cuda
  conditions:
    - key: act
      input_dim: 4
      encoder: mlp

training:
  loss: diffusion
  learning_rate: 1.0e-4
  diffusion_timesteps: 1000
  grad_clip_norm: 1.0
  inference_every_n_steps: 5000
  inference_num_steps: 25
  extra:
    amp_dtype: bf16
    video_logging:
      enable: true
      num_samples: 1
      fps: 4
      wandb_project: output-format-ablation-metaworld
