# FULL-DATA MetaWorld INTERVENTION TEST (2026-07-21): gatelow + BOTH landed
# countermeasures against the base-parity convergence —
#   gate_cap: 0.9        (anti-saturation clamp; uxrst2k5 measured the trap)
#   sigma_shift: 5.0     (training noise concentrated at high sigma, where
#                         action information carries loss signal; train-only)
# Also vs the original gatelow config: step conditioning + shortcut terms OFF
# (pure denoise, no confound), quality_eval_num_steps 1 -> 10, output_dir +
# checkpointing added. condition_on_base_outputs stays TRUE (deliberate: this
# run tests cap+shift on the standard architecture; the input-conditioning
# question is the nobase overfit pair's job).
# Readout: does the full-data adapter develop ANY action sensitivity
# (shuffle-probe the checkpoint) once supervision is concentrated and the
# gate can't shut? If not — strongest evidence yet that MetaWorld scripted
# demos don't reward actions (see thesis-vault
# 50_Decisions/open/second-dataset-action-informativeness.md).
#
# Launch (remote):
#   python scripts/train_wan22_i2v_metaworld_external.py \
#     --config configs/diffusion_wan22_avid_xattn_gatelow_cap_sigmashift_metaworld.yaml \
#     --wandb-run-name gatelow-cap09-sigmashift5
#
# ---- original gatelow header (still accurate for the base settings): ----
# Wan2.2-TI2V-5B (flow matching, diffusion forcing) + AVID-style action adapter,
# CROSS-ATTENTION action injection, AVID-matched (low) gate bias.
#
# Identical to diffusion_wan22_avid_xattn_i2v_metaworld.yaml (the original xattn
# arm) EXCEPT:
#   gate_bias:       4.0 -> 0.0   (σ(0)=0.5, balanced 50/50 at init — matches the
#                                  reference AVID repo's init_mask_bias: 0.0, not
#                                  our previous conservative 98/2 split. See
#                                  thesis-vault bug-adapter-gate-saturation-mask-mix.md
#                                  — a real run of AVID's own code with this exact
#                                  bias, on our MetaWorld data, showed the gate
#                                  actively moving and loss dropping ~9.5x; ours at
#                                  gate_bias=4.0 never got a chance to move.)
#   action_per_frame: (unset/false) -> true
#     Fixes a real bug in the ORIGINAL xattn run (wandb xb76ptw2): action_seq_len
#     was never set, so the cross-attention path fed UNBINNED raw-pixel-frame
#     action tokens (~41) against the 11-latent-frame query grid, with no
#     temporal masking — violating the decision doc's own non-negotiable
#     precondition (50_Decisions/open/action-conditioning-injection-mechanism.md).
#     action_per_frame: true pins action_seq_len to the latent frame count (11),
#     so cond["action_seq"] is properly binned this time. (Side effect: the
#     aggregated cond["action"] feeding the AdaLN path also becomes per-frame,
#     but ActionWanModel mean-pools any rank-3 embedding back to a single global
#     vector before AdaLN — see action_model.py — so the AdaLN path's
#     expressiveness is unchanged, only the cross-attention tokens are fixed.)
#
# This is the arm to compare against the mask_mix baseline
# (diffusion_wan22_avid_i2v_metaworld.yaml) and the replace arm
# (diffusion_wan22_avid_xattn_replace_metaworld.yaml) below — same base/data/
# injection, only composition (and now gate_bias) differs.
#
# Run with scripts/train_wan22_i2v_metaworld_EXTERNAL.py — NOT the plain
# train_wan22_i2v_metaworld.py (real weights + action_per_frame wiring only
# exist there; see diffusion_wan22_dcunet_output_metaworld.yaml's header).
#
# PREREQUISITES: Wan2.2-TI2V-5B DiT + Wan2.2_VAE.pth in the ckpt dir.

name: diffusion_wan22_avid_xattn_gatelow_cap_sigmashift_metaworld

data:
  frame_stride: 1
  fs_value: 1
  val_fraction: 0.01
  # eval_hdf5: ds/metaworld_corner2_val.hdf5

model:
  type: flow
  provider: wan2.2
  prediction_type: velocity
  freeze: true
  # pretrained_model_name_or_path: ckpts/Wan2.2-TI2V-5B
  extra:
    wan_config_path: configs/base/wan2.2_ti2v_5B.yaml
    allow_missing_checkpoint: true
    dtype: bf16
    latent_channels: 48
    temporal_length: 41     # pixel-frame window -> 11 latent frames (t_lat = 1 + (41-1)/4)
    max_area: 589824         # 704 * 1280
    latent_height: 16
    latent_width: 16
    text_prompts_file: configs/prompts/metaworld_tasks.yaml   # null -> frame-only (no text)

adapter:
  type: output
  hidden_dim: 256
  feature_dim: 48            # Wan2.2 latent channel count
  composition: mask_mix      # AVID prediction-blend: base*σ(gate) + pred*(1-σ(gate))
  gate_bias: 0.0             # balanced 50/50 at init (AVID-matched)
  gate_cap: 0.9              # clamp σ(g) ≤ 0.9 — anti-saturation (uxrst2k5 trap)
  extra:
    backbone: wan            # AVID-style: a small action-conditioned Wan DiT
    wan_adapter_config_path: configs/base/wan_adapter_34m.yaml
    condition_on_base_outputs: true
    use_step_level_conditioning: false
    step_level_key: step_level
    step_level_transform: log2
    action_dropout_prob: 0.0
    # --- action-conditioning injection ---
    action_injection: cross_attention   # adaln | cross_attention | both
    action_max_len: 64                  # positional-embedding capacity for action tokens
    # action_token_key: action_seq      # (default) per-frame tokens from the preprocessor

conditioning:
  type: action
  input_dim: 4             # MetaWorld action dimension (also the per-token width)
  output_dim: 512
  drop_condition_prob: 0.0

training:
  loss: flow_matching
  output_dir: outputs/gatelow-cap-sigmashift-run
  checkpoint_every_n_steps: 500
  keep_last_checkpoints: 3
  learning_rate: 1.0e-4
  grad_clip_norm: 1.0
  shortcut_direction_weight: 0.0       # pure denoise — no shortcut confound in this intervention test
  shortcut_target_method: distillation
  inference_every_n_steps: 300
  eval_every_n_steps: 300
  quality_metrics: [psnr, ssim, lpips, mse]
  quality_eval_num_batches: 4
  quality_eval_num_steps: 10
  quality_dist_metrics: [fvd, fid]
  quality_dist_every_n_steps: 300
  quality_dist_num_batches: 4

  extra:
    amp_dtype: bf16
    use_batch_timesteps_for_flow: true
    flow_timestep_scale: 1000
    sigma_shift: 5.0          # train-time timestep shift toward high noise (eval stays U(0,1))
    inference_guide_scale: 5.0
    inference_shift: 5.0
    inference_use_prompt: true
    inference_frame_num: 41
    inference_seed: 0
    inference_max_area: 589824
    cond_frames: 1
    cond_frames_dist:
      1: 1
    # Pins action_seq_len to the latent frame count (11) -- fixes the
    # unbinned/unmasked cross-attention token bug from the original xattn run.
    action_per_frame: false
    shortcut_anchor_prob: 1.0
    shortcut_step_schedule:
      units: normalized
      mode: log2
      min: 1/128
      max: 1
      base: 2
    eval_step_schedule:
      - {num_steps: 1,  step_level: 1.0}
      - {num_steps: 2,  step_level: 0.5}
      - {num_steps: 4,  step_level: 0.25}
      - {num_steps: 8,  step_level: 0.125}
      - {num_steps: 25, step_level: 0.04}
      - {num_steps: 50, step_level: 0.02}

    wandb:
      enable: true
      require_vae: false
      project: Wan2.2-avid-xattn-gatelow-i2v-metaworld
      num_samples: 3
      fps: 5
