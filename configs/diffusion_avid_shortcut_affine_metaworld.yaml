name: diffusion_avid_shortcut_affine_metaworld

# AVID-style output adapter on DynamiCrafter with shortcut supervision —
# AFFINE-CHANNEL output format variant of `diffusion_avid_shortcut_metaworld.yaml`.
#
# Same frozen base and same action-conditioned UNet (AVID 11M) trained with the
# same shortcut schedule. The ONE difference is the output parameterisation:
# instead of emitting a full prediction blended by a per-pixel gate
# (`avid_mask_mix`), the adapter emits a per-channel AFFINE modulation of the
# base velocity — the UNet produces 2C channels split into (scale, shift),
# pooled to one value per channel, and the returned delta is base*scale + shift
# (composed as base*(1+scale)+shift under `add`).
#
# Why `add`, not a mask: affine returns a delta (output_kind="delta"), which the
# mask/gate path cannot consume — the DynamiCrafter output adapter raises on
# affine+output_mask. So this arm composes additively. Affine is channel-wise
# only by design (a dense per-element map would subsume the direct delta); see
# thesis-vault tech/affine-output-granularity and decided/output-format-affine-vs-direct.

data:
  frame_stride: 4
  fs_value: 1
  # env: reach-v3       # str or list of env names; omit = all environments
  # camera: corner2     # str or list of cameras (camera-split layout); omit = all cameras

model:
  type: diffusion
  provider: dynamicrafter
  prediction_type: velocity
  freeze: true
  pass_cond_to_base: true
  extra:
    unet_config_path: configs/base/dynamicrafter512.yaml
    strict_checkpoint: true
    latent_channels: 4
    latent_height: 16
    latent_width: 16
    temporal_length: 16
    allow_dummy_concat_condition: false
    allow_missing_checkpoint: true
    load_first_stage_model: true

adapter:
  type: output
  hidden_dim: 512
  # Affine returns a delta, so it composes additively (base + base*scale+shift).
  # mask_mix is unavailable for the affine format (it needs a full prediction).
  composition: add
  extra:
    architecture: dynamicrafter
    unet_config_path: external_repos/avid/latent_diffusion/configs/train/act_cond_diffusion_11M.yaml
    # The ablated axis vs `diffusion_avid_shortcut_metaworld.yaml`: affine
    # (per-channel scale+shift) instead of a masked full prediction.
    output_format: affine
    output_mask: false
    condition_on_base_outputs: true
    strict_checkpoint: false
    # Step-level conditioning on the adapter side; trainer must use the same key.
    use_step_level_conditioning: true
    step_level_key: step_level
    step_level_hidden_dim: 64
    # log2 feeds log2(s) into the Linear(1,·) embed so a dyadic step schedule
    # spans a well-conditioned range (~[-7,0]). Use "linear" to feed s directly.
    step_level_transform: log2
    allow_dummy_concat_condition: true

conditioning:
  type: structured
  output_dim: 512
  drop_condition_prob: 0.0
  extra:
    context_tokens: 77
    context_dim: 1024
    temporal_length: 8
    action_dim: 4
    image_encoder_device: cuda
  conditions:
    - key: act
      input_dim: 4
      encoder: mlp

training:
  loss: diffusion
  learning_rate: 1.0e-4
  diffusion_timesteps: 1000
  grad_clip_norm: 1.0
  shortcut_direction_weight: 1.0
  shortcut_target_method: distillation
  inference_every_n_steps: 3000
  inference_num_steps: 50
  output_dir: outputs/diffusion_avid_shortcut_affine_metaworld
  log_metrics_jsonl: true
  checkpoint_every_n_steps: 2000
  keep_last_checkpoints: 3
  eval_every_n_steps: 2000
  eval_num_batches: 8
  eval_metric: base_loss
  extra:
    amp_dtype: bf16
    shortcut_step_level_key: step_level
    shortcut_anchor_prob: 0.6
    eval_step_schedule:
      - { num_steps: 1,  step_level: 1.0 }
      - { num_steps: 2,  step_level: 0.5 }
      - { num_steps: 4,  step_level: 0.25 }
      - { num_steps: 8,  step_level: 0.125 }
      - { num_steps: 25, step_level: 0.04 }
    shortcut_step_schedule:
      units: normalized
      mode: log2
      min: 1/128   # finest — grounded by the standard loss
      max: 1       # one-step
      base: 2
    video_logging:
      enable: true
      num_samples: 1
      fps: 2
      wandb_project: avid-shortcut-affine-metaworld
