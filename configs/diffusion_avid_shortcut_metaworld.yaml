name: diffusion_avid_shortcut_metaworld

# AVID-style output adapter on DynamiCrafter, trained with shortcut
# supervision on the MetaWorld HDF5 dataset.
#
# The frozen DynamiCrafter UNet provides the base velocity prediction. The
# adapter is a small action-conditioned UNet (AVID 11M) that produces a
# delta + a per-pixel gate ("avid_mask_mix" composition):
#
#     prediction = base * sigmoid(gate) + adapted * (1 - sigmoid(gate))
#
# The trainer samples a random ``step_level`` per batch, injects it into the
# cond mapping, and supervises the *adapted* output toward
# ``base(x_t, t, cond) * step_level``. The adapter's own step-level branch
# consumes the same value so it learns which multi-step horizon is active.

model:
  type: diffusion
  provider: dynamicrafter
  prediction_type: velocity
  freeze: true
  pass_cond_to_base: true
  extra:
    unet_config_path: configs/base/dynamicrafter512.yaml
    strict_checkpoint: false
    latent_channels: 4
    latent_height: 16
    latent_width: 16
    temporal_length: 16
    allow_dummy_concat_condition: false
    allow_missing_checkpoint: true
    load_first_stage_model: true

adapter:
  type: output
  hidden_dim: 512
  composition: avid_mask_mix
  gate_bias: 0.0
  extra:
    architecture: dynamicrafter
    unet_config_path: external_repos/avid/latent_diffusion/configs/train/act_cond_diffusion_11M.yaml
    condition_on_base_outputs: true
    output_mask: true
    strict_checkpoint: false
    # Step-level conditioning on the adapter side; trainer must use the same key.
    use_step_level_conditioning: true
    step_level_key: step_level
    step_level_hidden_dim: 64
    # The trainer injects a normalised step size s ∈ (0,1] (see
    # training.extra.shortcut_step_schedule). `log2` feeds log2(s) into the
    # Linear(1,·) embed so a dyadic schedule spans a well-conditioned range
    # (~[-7,0]) instead of crushing the fine end near zero. Use "linear" to
    # feed s directly (also fine since it is now bounded).
    step_level_transform: log2
    allow_dummy_concat_condition: true

conditioning:
  type: structured
  output_dim: 512
  drop_condition_prob: 0.05
  extra:
    context_tokens: 77
    context_dim: 1024
    temporal_length: 8
    action_dim: 4
    image_encoder_device: cuda
  conditions:
    - key: act
      input_dim: 4
      encoder: mlp
    # step_level is intentionally NOT in the structured-condition list.
    # The trainer injects a per-batch (B,) tensor under cond["step_level"];
    # mixing it with per-frame ``act`` (B,T,A) in the StructuredConditionEncoder
    # would crash on rank mismatch. The DynamicCrafter output adapter's
    # ``use_step_level_conditioning`` branch consumes cond["step_level"]
    # directly via its step_level_embed (Linear(1, ...)).

training:
  loss: diffusion
  learning_rate: 1.0e-4
  diffusion_timesteps: 1000
  grad_clip_norm: 1.0
  shortcut_direction_weight: 1.0
  # See docs/comments in diffusion_hyperalign_shortcut_metaworld.yaml.
  #   two_step      - Base-anchored Heun (one proper DDIM micro-step under base).
  #   distillation  - Paper-faithful self-consistency with anchor split.
  shortcut_target_method: distillation
  inference_every_n_steps: 5000
  inference_num_steps: 25
  extra:
    amp_dtype: bf16
    shortcut_step_level_key: step_level
    shortcut_anchor_prob: 0.6
    # Paper-faithful step-size schedule (Frans et al. 2024). Canonical unit is a
    # NORMALISED step size s ∈ (0,1]: s=1 is one-step generation, s=1/128 the
    # finest. This single schedule drives BOTH training (a step size sampled per
    # batch; the finest level is the anchor/grounding step) AND the eval grid
    # (each level s → num_steps = round(1/s), injecting step_level = s).
    #
    #   units: normalized | timesteps   (timesteps values are divided by T=1000)
    #   mode:  log2 | explicit | uniform
    #     log2     -> dyadic ladder from min to max (set below = paper's 8 sizes)
    #     explicit -> values: [..] list in `units`
    #     uniform  -> sample continuously in [min, max]
    # Bounds/values accept readable fractions (parsed to floats), e.g. 1/128.
    shortcut_step_schedule:
      units: normalized
      mode: log2
      min: 1/128   # finest — grounded by the standard loss
      max: 1       # one-step
      base: 2
    # Eval grid is derived from shortcut_step_schedule above (levels →
    # 1/2/4/.../128 steps). Override here with an explicit eval_step_schedule
    # (list of {num_steps, step_level}) only to probe levels outside training.
    video_logging:
      enable: true
      num_samples: 2
      fps: 4
      wandb_project: avid-shortcut-metaworld
