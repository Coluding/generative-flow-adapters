# Wan2.1-T2V-1.3B (flow matching) + action-conditioned output adapter,
# trained on the MetaWorld HDF5 dataset.
#
# The frozen Wan DiT provides the base velocity prediction. A small
# backbone-agnostic transformer output head produces an action-conditioned,
# step-size-conditioned delta over the 16-channel Wan latent
# (prediction = base + delta), trained with flow-native shortcut
# self-consistency (rectified-flow Euler micro-step, not DDIM).
#
# PREREQUISITES for a real run (see thesis-vault feat-wan21-backbone-integration):
#   1. Wan2.1-T2V-1.3B checkpoint at model.pretrained_model_name_or_path
#      (HF: Wan-AI/Wan2.1-T2V-1.3B). Until then allow_missing_checkpoint runs
#      with random base weights.
#   2. Wan-VAE encoding of MetaWorld pixels -> 16-channel latents (P4). The
#      latent geometry below (channels=16, stride-8 spatial) assumes Wan-VAE,
#      NOT the 4-channel DynamiCrafter SD-VAE used by the avid configs.

name: diffusion_wan_avid_shortcut_metaworld

data:
  frame_stride: 4
  fs_value: 1
  # env: reach-v3       # str or list; omit = all environments
  # camera: corner2     # str or list; omit = all cameras

model:
  type: flow
  provider: wan2.1
  prediction_type: velocity
  freeze: true
  # pretrained_model_name_or_path: ckpts/Wan2.1-T2V-1.3B   # HF snapshot dir
  extra:
    wan_config_path: configs/base/wan2.1_t2v_1_3B.yaml
    allow_missing_checkpoint: true
    dtype: bf16
    # Wan-VAE latent geometry (vae_stride = (4, 8, 8), z_dim = 16).
    latent_channels: 16
    temporal_length: 8
    latent_height: 32
    latent_width: 32

adapter:
  type: output
  hidden_dim: 256
  feature_dim: 16            # Wan latent channel count
  extra:
    backbone: wan            # AVID-style: a small action-conditioned Wan DiT as the delta
    wan_adapter_config_path: configs/base/wan_adapter_11m.yaml
    condition_on_base_outputs: true
    use_step_level_conditioning: true
    step_level_key: step_level
    step_level_transform: log2
    action_dropout_prob: 0.0

conditioning:
  type: action
  input_dim: 4             # MetaWorld action dimension
  output_dim: 512
  drop_condition_prob: 0.0

training:
  loss: flow_matching
  learning_rate: 1.0e-4
  grad_clip_norm: 1.0
  shortcut_direction_weight: 1.0       # enable shortcut self-consistency supervision
  shortcut_target_method: distillation
  inference_every_n_steps: 2000
  inference_num_steps: 50
  extra:
    amp_dtype: bf16                  # autocast (NOT model dtype) — see bf16 memory note
    use_batch_timesteps_for_flow: true  # use the (x_t,t,target) triple the WanBatchPreprocessor builds
    flow_timestep_scale: 1000            # model fed t = sigma*scale (Wan native [0,1000])
    shortcut_anchor_prob: 0.75          # P(anchor step: standard flow loss only, no shortcut target)
    # Paper-faithful shortcut step schedule, identical to the DynamiCrafter/AVID
    # configs. Normalised s ∈ (0,1] over a log2 ladder down to 1/128, so the
    # adapter is supervised across the full multi-step range (not just the
    # shallow <=8-step dyadic ladder). Flow makes the self-consistency target
    # exact (straight-line Euler, no curvature), so there is no reason to limit
    # the depth. The anchor grounds the finest rung (1/128) with the standard
    # flow loss. Replaces the old `shortcut_max_log2_steps: 3` knob.
    shortcut_step_schedule:
      units: normalized
      mode: log2
      min: 1/128   # finest — grounded by the standard flow loss at the anchor
      max: 1       # one-step
      base: 2
    # Multi-step shortcut eval grid logged every `inference_every_n_steps`:
    # rows are sampling-step counts, columns are [GT | base | adapted]. Each row
    # injects step_level = 1/num_steps so the adapter approximates that horizon.
    # Mirrors the AVID shortcut grid (incl. the 25-step many-step reference); all
    # rows sit inside the trained [1/128, 1] range (interpolation).
    eval_step_schedule:
      - {num_steps: 1,  step_level: 1.0}
      - {num_steps: 2,  step_level: 0.5}
      - {num_steps: 4,  step_level: 0.25}
      - {num_steps: 8,  step_level: 0.125}
      - {num_steps: 25, step_level: 0.04}
    wandb:
      enable: true
      require_vae: false                # Wan-VAE has no decode_first_stage; injected at runtime
      project: wan-avid-shortcut-metaworld
      num_samples: 2
      fps: 4
