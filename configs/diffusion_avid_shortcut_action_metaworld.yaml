name: diffusion_avid_shortcut_action_metaworld

# Combined run: AVID output adapter on DynamiCrafter, trained with BOTH
#   (a) shortcut self-consistency supervision (shortcut_anchor_prob = 0.5), and
#   (b) action conditioning on a_t.
#
# This is the natural next step after the two local sanity checks:
#   - diffusion_avid_shortcut_metaworld.yaml      (anchor_prob = 1.0, baseline)
#   - the earlier anchor_prob = 0.5 shortcut run  (step-level only, dynamics random)
# Goal here: keep the few-step robustness from the shortcut loss while making the
# predicted dynamics actually respond to the action, rather than wandering.
#
# Action path (grounded, not assumed):
#   - The AVID adapter UNet (act_cond_diffusion_11M.yaml) is natively
#     action_conditioned: True, action_dropout_prob: 0.0.
#   - `conditioning.conditions[act]` below builds a_t from the batch and
#     dynamicrafter.py passes it straight into that UNet's action head.
#   - The adapter therefore conditions on BOTH step_level and a_t.
#
# This config differs from diffusion_avid_shortcut_metaworld.yaml in exactly:
#   shortcut_anchor_prob 1.0 -> 0.5, name/output_dir/wandb_project.
# Everything else is held identical so the two runs are directly comparable.
#
# VERIFY BEFORE THE HPC RUN (see thesis-vault ticket
# exp-conditioning-add-actions-to-shortcut-adapter):
#   1. The MetaWorld batch actually provides `act` (non-null) at train time, and
#      eval conditions on the *real* action sequence (not dropped/null), otherwise
#      "action conditioning" is nominal only.
#   2. The action a_t is held FIXED across the self-consistency micro-step — both
#      no-grad half-step calls in compute_self_consistency_target_v must see the
#      same a_t, or the consistency target is ill-defined.

data:
  frame_stride: 4
  fs_value: 1
  # env: reach-v3       # str or list of env names; omit = all environments
  # camera: corner2     # str or list of cameras (camera-split layout); omit = all cameras

model:
  type: diffusion
  provider: dynamicrafter
  prediction_type: velocity
  freeze: true
  pass_cond_to_base: true
  extra:
    unet_config_path: configs/base/dynamicrafter512.yaml
    strict_checkpoint: true
    latent_channels: 4
    latent_height: 16
    latent_width: 16
    temporal_length: 16
    allow_dummy_concat_condition: false
    allow_missing_checkpoint: true
    load_first_stage_model: true

adapter:
  type: output
  hidden_dim: 512
  composition: avid_mask_mix
  gate_bias: 0.0
  extra:
    architecture: dynamicrafter
    unet_config_path: external_repos/avid/latent_diffusion/configs/train/act_cond_diffusion_11M.yaml
    condition_on_base_outputs: true
    output_mask: true
    strict_checkpoint: false
    use_step_level_conditioning: true
    step_level_key: step_level
    step_level_hidden_dim: 64
    step_level_transform: log2
    allow_dummy_concat_condition: true

conditioning:
  type: structured
  output_dim: 512
  drop_condition_prob: 0.0
  extra:
    context_tokens: 77
    context_dim: 1024
    temporal_length: 8
    action_dim: 4
    image_encoder_device: cuda
  conditions:
    - key: act
      input_dim: 4
      encoder: mlp

training:
  loss: diffusion
  learning_rate: 1.0e-4
  diffusion_timesteps: 1000
  grad_clip_norm: 1.0
  shortcut_direction_weight: 1.0
  shortcut_target_method: distillation
  inference_every_n_steps: 2000
  inference_num_steps: 50
  # Run artifacts: metrics.jsonl + checkpoints/ are written under output_dir
  # (CLI --output-dir overrides; defaults to outputs/<name> in the script).
  output_dir: outputs/diffusion_avid_shortcut_action_metaworld
  log_metrics_jsonl: true
  checkpoint_every_n_steps: 2000
  keep_last_checkpoints: 3
  eval_every_n_steps: 2000
  eval_num_batches: 8
  eval_metric: base_loss
  extra:
    amp_dtype: bf16
    shortcut_step_level_key: step_level
    # Shortcut ON: 50% anchor (finest step, standard loss) / 50% self-consistency
    # at coarser step levels. Matches the earlier 0.5 shortcut run.
    shortcut_anchor_prob: 0.5
    eval_step_schedule:
      - { num_steps: 1,  step_level: 1.0 }
      - { num_steps: 2,  step_level: 0.5 }
      - { num_steps: 4,  step_level: 0.25 }
      - { num_steps: 8,  step_level: 0.125 }
      - { num_steps: 25, step_level: 0.04 }
    shortcut_step_schedule:
      units: normalized
      mode: log2
      min: 1/128   # finest — grounded by the standard loss
      max: 1       # one-step
      base: 2
    video_logging:
      enable: true
      num_samples: 1
      fps: 2
      wandb_project: avid-shortcut-action-metaworld
